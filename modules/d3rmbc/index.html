<section class="modulex-sayac-mozaik{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-mozaik-ic">
    {{fbbas}}
    {{fbgovde}}

</section>

<style>
  /* sayac-mozaik — Eşit ızgara değil: genişliği ve zemini dönüşen karolarla ritimli bir mozaik (bento'nun 2×2 kahramanı yok, satır satır asimetri var). */
  .modulex-sayac-mozaik { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-mozaik *, .modulex-sayac-mozaik *::before, .modulex-sayac-mozaik *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-mozaik :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-mozaik :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-mozaik :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-mozaik :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-mozaik img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-mozaik) img { height: auto; }
  .modulex-sayac-mozaik [hidden] { display: none !important; }
  .modulex-sayac-mozaik :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-mozaik :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-mozaik-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-mozaik-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-mozaik--bassiz .modulex-sayac-mozaik-bas { display: none; }
  .modulex-sayac-mozaik-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-mozaik-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-mozaik-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-mozaik-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-sayac-mozaik-ust { grid-column: 1 / -1; }
  .modulex-sayac-mozaik-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-mozaik-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-mozaik-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-mozaik-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-mozaik-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-mozaik-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-mozaik-mozaik { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
  .modulex-sayac-mozaik-karo { position: relative; display: grid; align-content: end; gap: 6px; min-height: 200px; padding: 26px; border-radius: --yuvarlak--; overflow: hidden; transition: transform 0.35s ease, opacity 0.6s ease; }
  .modulex-sayac-mozaik-karo:nth-child(4n + 1), .modulex-sayac-mozaik-karo:nth-child(4n + 4) { grid-column: span 4; }
  .modulex-sayac-mozaik-karo:nth-child(4n + 2), .modulex-sayac-mozaik-karo:nth-child(4n + 3) { grid-column: span 2; }
  .modulex-sayac-mozaik-karo:last-child:nth-child(4n + 1) { grid-column: 1 / -1; }
  .modulex-sayac-mozaik-karo:last-child:nth-child(4n + 3) { grid-column: span 4; }
  .modulex-sayac-mozaik-karo--a { background: --vurguBg--; color: --vurguText--; }
  .modulex-sayac-mozaik-karo--b { background: --kartBg--; }
  .modulex-sayac-mozaik-karo--c { border: 2px solid --text--; }
  .modulex-sayac-mozaik-karo:hover { transform: scale(0.985); }
  .modulex-sayac-mozaik--hazir:not(.modulex-sayac-mozaik--gor) .modulex-sayac-mozaik-karo { opacity: 0; transform: scale(0.94); }
  .modulex-sayac-mozaik-ikon { position: absolute; inset-block-start: 22px; inset-inline-end: 22px; font-size: 30px; opacity: 0.85; }
  .modulex-sayac-mozaik-sayi { font-size: clamp(2.2rem, 4.4vw, 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .modulex-sayac-mozaik-ek { font-size: 0.55em; }
  .modulex-sayac-mozaik-karo--b .modulex-sayac-mozaik-ek, .modulex-sayac-mozaik-karo--c .modulex-sayac-mozaik-ek { color: --accentInk--; }
  .modulex-sayac-mozaik-etiket { font-size: 1.02rem; font-weight: 700; }
  .modulex-sayac-mozaik-not { font-size: 0.9rem; }
  @media (max-width: 768px) {
    .modulex-sayac-mozaik-mozaik { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modulex-sayac-mozaik-karo, .modulex-sayac-mozaik-karo:nth-child(n) { grid-column: span 1; min-height: 160px; padding: 18px; }
    .modulex-sayac-mozaik-karo:nth-child(3n + 1) { grid-column: 1 / -1; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-mozaik :is(.modulex-sayac-mozaik-baslik, .modulex-sayac-mozaik-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-mozaik-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-sayac-mozaik-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-sayac-mozaik { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-mozaik *, .modulex-sayac-mozaik *::before, .modulex-sayac-mozaik *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-mozaik";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
